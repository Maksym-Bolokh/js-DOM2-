<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="gallery-container">
    <h1>Галерея картинок</h1>
    <div id="gallery" class="gallery"></div>
    <div class="buttons">
      <button id="loadMoreButton">Завантажити ще 4 картинки</button>
      <button id="clearButton">Очистити галерею</button>
      <button id="removeButton">Видалити останню картинку</button>
      <button id="reverseButton">Перевернути галерею</button>
    </div>
  </div>

  
  <script type="module" src="main.js"></script>
</body>
</html>
